name: flutter_nfc_kit_example
description: Demonstrates how to use the flutter_nfc_kit plugin.
publish_to: 'none'

environment:
  sdk: ">=3.11.0 <4.0.0"
  flutter: ">=3.47.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_nfc_kit:
    path: ../
  logging: ^1.3.0
  ndef: ^0.4.0
  cupertino_icons: ^1.0.9

dev_dependencies:
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
